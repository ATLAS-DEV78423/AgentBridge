name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22, 24]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Type check
        run: npm run typecheck

      - name: Validate agent configs (doctor)
        run: npx tsx src/cli/main.ts doctor .

      - name: Build dist/
        run: npm run build

      - name: Smoke-test compiled CLI (scan, doctor, fix)
        run: bash scripts/smoke.sh

  # Proves every supported source→target migration pair through the real
  # CLI (seed → migrate → doctor-validate → data checks). Runs once: the
  # pair matrix isn't node-version-sensitive, and the unit/integration
  # matrix above already covers both versions.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Full-migration sweep (156 pairs)
        run: npm run sweep
